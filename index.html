<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="description" content="The Hideout: a live voxel map of who is at work right now." />
    <title>The Hideout</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #0b0a10;
        color: #e9dcc0;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #0b0a10;
        transition: opacity 0.4s ease;
      }
      #boot.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .lantern {
        width: 14px;
        height: 22px;
        border-radius: 5px;
        background: #ffb347;
        box-shadow:
          0 0 18px 6px rgba(255, 170, 70, 0.55),
          0 0 60px 20px rgba(255, 140, 40, 0.2);
        animation: flicker 2.4s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }
      @keyframes flicker {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .lantern {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="lantern"></div>
      <p>Entering the Hideout...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
